name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # chart-releaser runs `helm package`, which refuses a chart whose
      # dependencies are not already in charts/. servarr depends on common by
      # relative path, so resolve it here — that also makes the published servarr
      # self-contained rather than needing an index that this run has not written
      # yet.
      - name: Vendor chart dependencies
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency update "$chart"
          done

      - uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
          skip_existing: true
          packages_with_index: true
