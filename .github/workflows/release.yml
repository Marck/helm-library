name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # servarr depends on common through the published index. `helm dependency
      # update` copes with a repository that is not registered ("unmanaged"), but
      # chart-releaser does not: it fails with
      #   Error: no repository definition for https://Marck.github.io/helm-library
      # even though the dependency is already vendored into charts/. Registering
      # the repo first is what the packaging step needs.
      #
      # Pointing at its OWN index is safe because release order is one way: a
      # consumer only ever pins a version that is already published, never the one
      # this run is about to write.
      - name: Register the published chart repository
        run: |
          helm repo add helm-library https://Marck.github.io/helm-library
          helm repo update

      # chart-releaser runs `helm package`, which refuses a chart whose
      # dependencies are not already in charts/, so resolve them here. It also
      # makes the published servarr self-contained.
      - name: Vendor chart dependencies
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency update "$chart"
          done

      - uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
          skip_existing: true
          packages_with_index: true
