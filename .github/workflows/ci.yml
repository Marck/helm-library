name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint --strict
        run: |
          helm lint --strict charts/common
          # servarr is deliberately unusable without an app identity, so lint it
          # with the smallest complete input rather than with none.
          helm dependency update charts/servarr
          helm lint --strict charts/servarr -f charts/servarr/ci/example-values.yaml
          helm template servarr charts/servarr -f charts/servarr/ci/example-values.yaml >/dev/null

      - name: Template test chart against local common
        run: |
          helm dependency update tests/common-test-chart
          helm lint --strict tests/common-test-chart
          helm template test tests/common-test-chart -f tests/common-test-chart/values.yaml
          helm template test tests/common-test-chart -f tests/common-test-chart/values-multi-pv.yaml

      # common.sso.validate is only useful if it also REJECTS bad input, which
      # `helm template` alone can't assert (a passing render proves nothing).
      - name: SSO policy negative tests
        run: tests/sso-negative.sh

      # Same reasoning for the init-container helpers: they matter as much for
      # where they do NOT fire (a second component would mount a volume it never
      # declared) and for what they refuse (an unbounded wait, an unverified auth
      # edit) as for what they render, and a passing render cannot assert that.
      - name: Init-container helper tests
        run: tests/init-containers.sh

      # The servarr chart's own tests: its auth edit is security-relevant (an
      # unverified pass starts a Servarr app with no authentication behind a
      # public Ingress), and a passing render cannot assert that.
      - name: servarr chart tests
        run: tests/servarr.sh
