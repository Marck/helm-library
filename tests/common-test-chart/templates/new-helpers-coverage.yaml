{{- /*
  Coverage for the common 0.4.4 helper additions (exercised by `helm template` in CI):
    - common.configmap with an explicit Name + Data  -> one-off generated ConfigMap
    - common.ingress as a SECOND ingress via Ingress/NameSuffix/ServiceName/ServicePort
  Both helpers take all they need as explicit params, so we pass the real context as
  Root directly (no values needed -> no loader-style merge).
*/ -}}
{{ include "common.configmap" (dict "Root" . "Name" "extra-cm" "Data" (dict
     "extra.json" (toPrettyJson (dict "hello" "world")))) }}
---
{{- /* The annotation below is what the top-level `sso.forwardAuthMarker` in
       values.yaml requires — covers the happy path of the common 0.5.8 opt-in
       SSO policy check. Negative cases live in tests/sso-negative.sh. */}}
{{ include "common.ingress" (dict "Root" .
     "Ingress" (dict
       "enabled" true
       "className" "nginx"
       "annotations" (dict "example.com/middlewares" "edge-auth@example")
       "hosts" (list (dict "host" "extra.example.com" "paths" (list (dict "path" "/" "pathType" "Prefix"))))
       "tls" true
       "tlsSecretName" "extra-tls")
     "NameSuffix" "extra-ingress"
     "ServiceName" "extra-svc"
     "ServicePort" 8080) }}
---
{{- /* common 0.5.0: namespaced Role/RoleBinding via explicit Config (cluster-wide
       ClusterRole path is covered by values.yaml through the loader) */}}
{{ include "common.rbac" (dict "Root" .
     "Config" (dict "rbac" (dict
       "create" true
       "name" "extra-role"
       "rules" (list (dict
         "apiGroups" (list "")
         "resources" (list "configmaps")
         "verbs" (list "get" "list")))))) }}
---
{{- /* common 0.5.2: common.namespace nodeSelector -> scheduler node-selector
       annotation, and the nodeSelectorEnabled=false override that suppresses it
       (for namespaces whose pods must run cluster-wide). Synthetic .Values so we
       don't disturb the loader-driven values above. */}}
{{ include "common.namespace" (dict
     "Values" (dict "namespace" "ns-pinned"
       "nodeSelector" (dict "node-role.kubernetes.io/worker" "worker"))
     "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template) }}
---
{{ include "common.namespace" (dict
     "Values" (dict "namespace" "ns-clusterwide"
       "nodeSelector" (dict "node-role.kubernetes.io/worker" "worker")
       "nodeSelectorEnabled" false
       "podSecurity" (dict "enabled" true "enforce" "privileged" "audit" "privileged" "warn" "privileged"))
     "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template) }}
---
{{- /* common 0.5.3: automountServiceAccountToken passthrough on the pod spec of
       cronjob/job (also wired into deployment/statefulset). Rendered only when the
       key is set, so charts that omit it are unchanged. */}}
{{ include "common.cronjob" (dict "Root" . "Component" "automount-cron"
     "Config" (dict
       "schedule" "0 * * * *"
       "automountServiceAccountToken" false
       "imagePullSecrets" (list (dict "name" "ghcr-pull"))
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true"))) }}
---
{{ include "common.job" (dict "Root" . "Component" "automount-job"
     "Config" (dict
       "automountServiceAccountToken" false
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true"))) }}
---
{{- /* common 0.5.6: serviceAccountName on job/cronjob pod specs (same SA
       resolution as common.deployment — rendered when created or named). */}}
{{ include "common.cronjob" (dict "Root" . "Component" "sa-cron"
     "Config" (dict
       "schedule" "*/5 * * * *"
       "serviceAccount" (dict "name" "watchdog-sa")
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true"))) }}
---
{{ include "common.job" (dict "Root" . "Component" "sa-job"
     "Config" (dict
       "serviceAccount" (dict "name" "watchdog-sa")
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true"))) }}
---
{{- /* common 0.7.2: ttlSecondsAfterFinished on common.cronjob auto-GCs finished
       Jobs (Complete AND Failed) so they don't linger to failedJobsHistoryLimit.
       hasKey-guarded, so 0 (delete immediately) renders; omitting it is
       unchanged. */}}
{{ include "common.cronjob" (dict "Root" . "Component" "ttl-cron"
     "Config" (dict
       "schedule" "*/5 * * * *"
       "ttlSecondsAfterFinished" 300
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true"))) }}
---
{{- /* Rendered only when tests/ensure-ownership.sh --sets it, to prove the
       REFUSALS: enabled with no paths, and no uid anywhere to inherit. Both must
       fail the render rather than emit an init container that chowns nothing. */}}
{{- if .Values.bareOwnership.enabled }}
{{ include "common.deployment" (dict "Root" . "Component" "bare-owner"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "ensureOwnership" .Values.bareOwnership)) }}
---
{{- end }}
{{- if .Values.bareWait.targets }}
{{ include "common.deployment" (dict "Root" . "Component" "bare-waiter"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "podSecurityContext" (dict "runAsUser" 1000)
       "waitFor" .Values.bareWait)) }}
---
{{- end }}
{{- /* common 0.8.0: waitFor — hold the pod at Init until a dependency answers,
       ALWAYS bounded (one chart's hand-rolled version was an unbounded `until`
       loop on busybox:latest). Two targets must share one init container, and
       the ordering against ensureOwnership and the chart's own inits matters. */}}
{{ include "common.deployment" (dict "Root" . "Component" "waiting-app"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "podSecurityContext" (dict "runAsUser" 11 "runAsNonRoot" true)
       "ensureOwnership" (dict
         "enabled" true
         "paths" (list (dict "volume" "files" "mountPath" "/files")))
       "waitFor" (dict
         "timeoutSeconds" 300
         "intervalSeconds" 5
         "targets" (list
           (dict "host" "test-postgresql" "port" 5432)
           (dict "host" "test-redis" "port" 6379 "timeoutSeconds" 60)))
       "initContainers" (list (dict
         "name" "migrate"
         "image" "busybox:1.36"
         "command" (list "true")))
       "volumeMounts" (list (dict "name" "files" "mountPath" "/files"))
       "volumes" (list (dict "name" "files" "emptyDir" dict)))) }}
---
{{- /* common 0.8.0: ensureOwnership — an NFS export arrives root-owned, so an
       unprivileged workload cannot write to its own directory. One root init
       container chowns it and exits; the workload stays unprivileged. Covered on
       a Deployment (inherits uid from podSecurityContext, and must render BEFORE
       the chart's own init container) and on a CronJob (an explicit gid, a mode,
       and a second path). The CronJob carries its uid on the CONTAINER context
       with only an fsGroup on the pod -- the shape several charts in helm-charts
       use -- and it must still be found. */}}
{{ include "common.deployment" (dict "Root" . "Component" "owned-app"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "podSecurityContext" (dict "runAsUser" 27 "runAsGroup" 100 "runAsNonRoot" true)
       "ensureOwnership" (dict
         "enabled" true
         "paths" (list (dict "volume" "config" "mountPath" "/config")))
       "initContainers" (list (dict
         "name" "seed-config"
         "image" "busybox:1.36"
         "command" (list "sh" "-c" "test -f /config/app.conf || cp /seed/app.conf /config/")))
       "volumeMounts" (list (dict "name" "config" "mountPath" "/config"))
       "volumes" (list (dict "name" "config" "emptyDir" dict)))) }}
---
{{ include "common.cronjob" (dict "Root" . "Component" "owned-backup"
     "Config" (dict
       "schedule" "0 3 * * *"
       "image" (dict "repository" "busybox" "tag" "1.36")
       "podSecurityContext" (dict "fsGroup" 65534 "runAsNonRoot" true)
       "securityContext" (dict "runAsUser" 65534)
       "ensureOwnership" (dict
         "enabled" true
         "gid" 100
         "paths" (list
           (dict "volume" "backup" "mountPath" "/backup" "mode" "0700")
           (dict "volume" "backup" "mountPath" "/backup2" "uid" 20)))
       "volumeMounts" (list (dict "name" "backup" "mountPath" "/backup"))
       "volumes" (list (dict "name" "backup" "emptyDir" dict)))) }}
---
{{- /* common 0.7.3: initContainers on common.cronjob — a Job whose mounted NFS
       directory has to be chowned to the unprivileged uid the Job runs as before
       it can write there. Mirrors the sealed-secrets key backup. */}}
{{ include "common.cronjob" (dict "Root" . "Component" "init-cron"
     "Config" (dict
       "schedule" "0 3 * * *"
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true")
       "podSecurityContext" (dict "runAsNonRoot" true "runAsUser" 65534)
       "initContainers" (list (dict
         "name" "ensure-ownership"
         "image" "busybox:1.36"
         "command" (list "sh" "-c" "chown 65534:65534 /backup")
         "securityContext" (dict "runAsUser" 0 "runAsNonRoot" false)
         "volumeMounts" (list (dict "name" "backup" "mountPath" "/backup"))))
       "volumeMounts" (list (dict "name" "backup" "mountPath" "/backup"))
       "volumes" (list (dict "name" "backup" "emptyDir" dict)))) }}
---
{{- /* common 0.6.0: common.daemonset — a per-node agent (hostNetwork, hostPort,
       control-plane tolerations, an empty env value, and an explicitly-empty
       nodeSelector that must CLEAR the inherited default rather than fall back to
       it). Mirrors a per-node metrics agent. */}}
{{ include "common.daemonset" (dict "Root" . "Component" "node-agent"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "hostNetwork" true
       "nodeSelector" (dict)
       "tolerations" (list (dict
         "effect" "NoSchedule"
         "key" "node-role.kubernetes.io/control-plane"
         "operator" "Exists"))
       "env" (dict "KEY" "" "LISTEN" "45876")
       "ports" (list (dict "containerPort" 45876 "hostPort" 45876 "name" "agent"))
       "volumeMounts" (list (dict "name" "agent-data" "mountPath" "/var/lib/agent"))
       "volumes" (list (dict "name" "agent-data" "emptyDir" (dict))))) }}
---
{{- /* common 0.6.1: a COMPONENT-scoped ServiceAccount — created with an explicit
       Name, bound by common.rbac's ServiceAccountName, and consumed by the Job via
       the Config-level serviceAccount.name. The chart-wide SA (values.yaml
       serviceAccount.create) must be untouched by all three, so a chart can give
       one hook Job API access without handing the SA to every pod. */}}
{{ include "common.serviceaccount" (dict "Root" .
     "Name" "scoped-hook-sa"
     "Config" (dict "serviceAccount" (dict "create" true "automount" false))) }}
---
{{ include "common.rbac" (dict "Root" .
     "ServiceAccountName" "scoped-hook-sa"
     "Config" (dict "rbac" (dict
       "create" true
       "name" "scoped-hook-role"
       "rules" (list (dict
         "apiGroups" (list "")
         "resources" (list "pods/exec")
         "verbs" (list "create")))))) }}
---
{{ include "common.job" (dict "Root" . "Component" "scoped-hook-job"
     "Config" (dict
       "serviceAccount" (dict "name" "scoped-hook-sa")
       "automountServiceAccountToken" true
       "image" (dict "repository" "busybox" "tag" "1.36")
       "command" (list "true"))) }}
---
{{- /*
  common 0.6.2: `template.labels` / `template.annotations` on a sealedSecrets
  entry — metadata for the Secret the controller UNSEALS, not the SealedSecret.
  The first entry adds an ArgoCD repo-creds label (the case this was added for);
  the second sets nothing, proving the defaults still render on their own.
*/ -}}
{{ include "common.sealedsecret" (dict "Root" . "Config" (dict "sealedSecrets" (list
     (dict "enabled" true "name" "ss-with-template-meta" "scope" "cluster-wide"
       "templateData" (dict "url" "AgAstub==")
       "template" (dict
         "labels" (dict "argocd.argoproj.io/secret-type" "repo-creds")
         "annotations" (dict "example.com/note" "unsealed-secret-metadata")))
     (dict "enabled" true "name" "ss-plain"
       "templateData" (dict "token" "AgAstub=="))))) }}
---
{{- /*
  common 0.7.1: `nodePort` on the multi-port branch of common.service. The first
  port pins one, the second deliberately does not — proving a pinned port and an
  API-server-allocated one can sit side by side in the same Service, which is the
  normal case (you pin only the port a human has to type during an outage).

  The single-port branch is covered by values.yaml's `service.nodePort`.
*/ -}}
{{ include "common.service" (dict "Root" . "Component" "pinned-nodeport"
     "Config" (dict "service" (dict
       "type" "LoadBalancer"
       "ports" (list
         (dict "name" "webui" "port" 11443 "targetPort" 443 "nodePort" 31443)
         (dict "name" "inform" "port" 8080))))) }}
---
{{- /* common 0.9.0: dnsConfig on common.cronjob and common.deployment. An
       alert-sending workload must still reach its notification host when
       in-cluster DNS is degraded, so it appends a public resolver AFTER the
       cluster one. Left on the default ClusterFirst policy on purpose: the
       entries are then additive, and cluster names keep resolving. */}}
{{ include "common.cronjob" (dict "Root" . "Component" "dns-fallback-cron"
     "Config" (dict
       "schedule" "*/2 * * * *"
       "image" (dict "repository" "busybox" "tag" "1.36")
       "dnsConfig" (dict "nameservers" (list "1.1.1.1" "9.9.9.9")))) }}
---
{{ include "common.deployment" (dict "Root" . "Component" "dns-fallback-app"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "dnsPolicy" "None"
       "dnsConfig" (dict
         "nameservers" (list "1.1.1.1")
         "searches" (list "svc.cluster.local")
         "options" (list (dict "name" "ndots" "value" "2"))))) }}
---
{{- /* common 0.10.0: priorityClassName. A per-node DNS cache is the case that
       forced it — under node pressure the kubelet evicts an ordinary pod, and
       every pod pointed at that cache loses DNS while the cause looks like
       anything but eviction. Covered on the DaemonSet and the CronJob because
       those two write the field at different nesting depths, which is exactly
       where an indentation mistake hides. */}}
{{ include "common.daemonset" (dict "Root" . "Component" "priority-agent"
     "Config" (dict
       "image" (dict "repository" "busybox" "tag" "1.36")
       "hostNetwork" true
       "priorityClassName" "system-node-critical")) }}
---
{{ include "common.cronjob" (dict "Root" . "Component" "priority-cron"
     "Config" (dict
       "schedule" "*/5 * * * *"
       "image" (dict "repository" "busybox" "tag" "1.36")
       "priorityClassName" "system-cluster-critical")) }}
