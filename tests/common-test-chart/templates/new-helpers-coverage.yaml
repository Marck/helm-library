{{- /*
  Coverage for the common 0.4.4 helper additions (exercised by `helm template` in CI):
    - common.configmap with an explicit Name + Data  -> one-off generated ConfigMap
    - common.ingress as a SECOND ingress via Ingress/NameSuffix/ServiceName/ServicePort
  Both helpers take all they need as explicit params, so we pass the real context as
  Root directly (no values needed -> no loader-style merge).
*/ -}}
{{ include "common.configmap" (dict "Root" . "Name" "extra-cm" "Data" (dict
     "extra.json" (toPrettyJson (dict "hello" "world")))) }}
---
{{ include "common.ingress" (dict "Root" .
     "Ingress" (dict
       "enabled" true
       "className" "nginx"
       "hosts" (list (dict "host" "extra.example.com" "paths" (list (dict "path" "/" "pathType" "Prefix"))))
       "tls" true
       "tlsSecretName" "extra-tls")
     "NameSuffix" "extra-ingress"
     "ServiceName" "extra-svc"
     "ServicePort" 8080) }}
---
{{- /* common 0.5.0: namespaced Role/RoleBinding via explicit Config (cluster-wide
       ClusterRole path is covered by values.yaml through the loader) */}}
{{ include "common.rbac" (dict "Root" .
     "Config" (dict "rbac" (dict
       "create" true
       "name" "extra-role"
       "rules" (list (dict
         "apiGroups" (list "")
         "resources" (list "configmaps")
         "verbs" (list "get" "list")))))) }}
---
{{- /* common 0.5.2: common.namespace nodeSelector -> scheduler node-selector
       annotation, and the nodeSelectorEnabled=false override that suppresses it
       (for namespaces whose pods must run cluster-wide). Synthetic .Values so we
       don't disturb the loader-driven values above. */}}
{{ include "common.namespace" (dict
     "Values" (dict "namespace" "ns-pinned"
       "nodeSelector" (dict "node-role.kubernetes.io/worker" "worker"))
     "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template) }}
---
{{ include "common.namespace" (dict
     "Values" (dict "namespace" "ns-clusterwide"
       "nodeSelector" (dict "node-role.kubernetes.io/worker" "worker")
       "nodeSelectorEnabled" false
       "podSecurity" (dict "enabled" true "enforce" "privileged" "audit" "privileged" "warn" "privileged"))
     "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template) }}
