# Test values file with multiple persistence volumes
nameOverride: "test-app"

# Required fields
image:
  repository: nginx
  tag: stable
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

persistenceVolumes:
  data:
    enabled: true
    nfs:
      server: nas.example.com
      path: /exports/data
    size: 10Gi
    accessModes:
      - ReadWriteMany
    storageClassName: ""
    reclaimPolicy: Retain
  # Covers mountOptions on the multi-PV path; `data` above deliberately omits it
  # so both branches (present / absent) render in one pass.
  config:
    enabled: true
    nfs:
      server: nas.example.com
      path: /exports/config
    size: 5Gi
    accessModes:
      - ReadWriteMany
    storageClassName: ""
    reclaimPolicy: Retain
    mountOptions:
      - vers=3
      - nolock
  media:
    enabled: true
    name: custom-media-pv
    pvcName: custom-media-pvc
    nfs:
      server: nas.example.com
      path: /exports/media
    size: 100Gi
    accessModes:
      - ReadWriteMany
    storageClassName: ""
    reclaimPolicy: Retain
