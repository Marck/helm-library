common:
  image:
    repository: nginx
    tag: stable
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  persistence:
    enabled: true
    nfs:
      server: loki.mastcloud.nl
      path: /exports/data
    size: 20Gi
    accessModes:
      - ReadWriteMany

  configmap:
    enabled: false

  sealedSecret:
    enabled: false

  ingress:
    enabled: false

  # Global pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  # Global container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  nodeSelector:
    disktype: nfs

  # Exercises the hostNetwork + sidecar additions in common 0.4.3
  hostNetwork: true
  additionalContainers:
    - name: sidecar
      image: nginx:stable
      ports:
        - containerPort: 8080
