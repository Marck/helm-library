common:
  image:
    repository: nginx
    tag: stable
    pullPolicy: IfNotPresent

  # Exercises the common 0.5.1 service additions: annotations, custom selector,
  # loadBalancerIP, externalTrafficPolicy
  service:
    type: LoadBalancer
    port: 80
    annotations:
      example.com/svc: test
    selector:
      app.kubernetes.io/part-of: custom-group
    loadBalancerIP: 203.0.113.10
    externalTrafficPolicy: Local
    loadBalancerClass: example.io/custom-lb
    # Exercises the common 0.7.1 nodePort addition on the single-port branch
    nodePort: 31080

  # Exercises the common 0.5.1 podLabels addition
  podLabels:
    example.com/pod: test

  # Exercises the common 0.5.5 deploymentAnnotations addition (annotations on
  # the Deployment object itself, e.g. ArgoCD sync-waves)
  deploymentAnnotations:
    argocd.argoproj.io/sync-wave: "1"

  persistence:
    enabled: true
    nfs:
      server: loki.mastcloud.nl
      path: /exports/data
    size: 20Gi
    accessModes:
      - ReadWriteMany

  configmap:
    enabled: false

  sealedSecret:
    enabled: false

  # Exercises the serviceaccount + rbac additions in common 0.5.0
  serviceAccount:
    create: true
    automount: true
    annotations:
      example.com/purpose: test

  rbac:
    create: true
    clusterWide: true
    rules:
      - apiGroups: [""]
        resources: [nodes, pods, namespaces]
        verbs: [get, list]
      - apiGroups: [metrics.k8s.io]
        resources: [nodes, pods]
        verbs: [get, list]

  ingress:
    enabled: false

  # Global pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  # Global container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  nodeSelector:
    disktype: nfs

  # Exercises the envFrom addition in common 0.5.0
  envFrom:
    - secretRef:
        name: test-secret
    - configMapRef:
        name: test-cm

  # Exercises the common 0.5.7 hostAliases addition (static /etc/hosts entries,
  # e.g. pinning an OIDC host to a Service ClusterIP to dodge hairpin NAT)
  hostAliases:
    - ip: 10.43.84.116
      hostnames:
        - auth.example.com

  # Exercises the common 0.7.0 additions: hostPort/hostIP on a container port,
  # lifecycle hooks and terminationGracePeriodSeconds
  ports:
    - containerPort: 80
      name: http
    - containerPort: 11084
      hostPort: 11084
      hostIP: "127.0.0.1"
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - grep -q example /etc/hosts || echo "127.0.0.1 example" >> /etc/hosts
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 1"]
  terminationGracePeriodSeconds: 120
  tty: true

  # Exercises the hostNetwork + sidecar additions in common 0.4.3
  hostNetwork: true
  additionalContainers:
    - name: sidecar
      image: nginx:stable
      ports:
        - containerPort: 8080

# ── common 0.5.8: opt-in SSO policy check ────────────────────────────────────
# Top-level (not under `common:`) because the direct common.ingress call in
# templates/new-helpers-coverage.yaml passes Root = . — that second Ingress
# carries the matching annotation, so this covers the happy path including
# forwardAuthMarker. Negative cases are asserted by tests/sso-negative.sh.
sso:
  enforce: true
  mode: forward-auth
  forwardAuthMarker: "edge-auth@example"

# Off by default; tests/ensure-ownership.sh --sets it to prove the refusals
# (enabled with no paths, and no uid anywhere to inherit) fail the render.
bareOwnership:
  enabled: false

# Off by default; tests/init-containers.sh --sets it to prove the waitFor
# refusals (a bound shorter than the interval, a target with no port).
bareWait:
  targets: []

