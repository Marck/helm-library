common:
  image:
    repository: nginx
    tag: stable
    pullPolicy: IfNotPresent

  # Exercises the common 0.5.1 service additions: annotations, custom selector,
  # loadBalancerIP, externalTrafficPolicy
  service:
    type: LoadBalancer
    port: 80
    annotations:
      example.com/svc: test
    selector:
      app.kubernetes.io/part-of: custom-group
    loadBalancerIP: 203.0.113.10
    externalTrafficPolicy: Local
    loadBalancerClass: example.io/custom-lb

  # Exercises the common 0.5.1 podLabels addition
  podLabels:
    example.com/pod: test

  persistence:
    enabled: true
    nfs:
      server: loki.mastcloud.nl
      path: /exports/data
    size: 20Gi
    accessModes:
      - ReadWriteMany

  configmap:
    enabled: false

  sealedSecret:
    enabled: false

  # Exercises the serviceaccount + rbac additions in common 0.5.0
  serviceAccount:
    create: true
    automount: true
    annotations:
      example.com/purpose: test

  rbac:
    create: true
    clusterWide: true
    rules:
      - apiGroups: [""]
        resources: [nodes, pods, namespaces]
        verbs: [get, list]
      - apiGroups: [metrics.k8s.io]
        resources: [nodes, pods]
        verbs: [get, list]

  ingress:
    enabled: false

  # Global pod-level security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  # Global container-level security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  nodeSelector:
    disktype: nfs

  # Exercises the envFrom addition in common 0.5.0
  envFrom:
    - secretRef:
        name: test-secret
    - configMapRef:
        name: test-cm

  # Exercises the hostNetwork + sidecar additions in common 0.4.3
  hostNetwork: true
  additionalContainers:
    - name: sidecar
      image: nginx:stable
      ports:
        - containerPort: 8080
